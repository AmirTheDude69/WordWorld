<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Wide World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">🌍</div>
          <div>
            <p class="eyebrow">Words of the Day</p>
            <h1>Word Wide World</h1>
          </div>
        </div>
        <div class="lang-switch" role="tablist" aria-label="Language selector">
          <button class="lang-btn active" data-lang="en" role="tab" aria-selected="true">
            🇺🇸 English
          </button>
          <button class="lang-btn" data-lang="uk" role="tab" aria-selected="false">
            🇺🇦 Ukrainian
          </button>
          <button class="lang-btn" data-lang="fa" role="tab" aria-selected="false">
            🇮🇷 Persian
          </button>
          <button class="lang-btn all-btn" data-lang="all" role="tab" aria-selected="false" hidden>
            ✨ All
          </button>
          <button class="lang-btn favorites-btn" data-lang="favorites" role="tab" aria-selected="false" hidden>
            ⭐ Favorites
          </button>
        </div>
      </header>

      <section class="view active" data-view="learning">
        <div class="card-shell">
          <div class="flip-card" id="wordCard">
            <article class="card-face card-front">
              <div class="card-meta">
                <span class="pronounce" id="wordPronounce">Loading…</span>
                <button class="icon-circle" id="speakBtn" aria-label="Pronounce word">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M3 9.5v5h4.4l4.1 3.5V6L7.4 9.5H3Zm13.5-2.9a1 1 0 0 1 1.4 0 7.2 7.2 0 0 1 0 10.2 1 1 0 1 1-1.4-1.4 5.2 5.2 0 0 0 0-7.4 1 1 0 0 1 0-1.4Zm-2.4 2.4a1 1 0 0 1 1.4 0 3.8 3.8 0 0 1 0 5.4 1 1 0 1 1-1.4-1.4 1.8 1.8 0 0 0 0-2.6 1 1 0 0 1 0-1.4Z"
                      fill="currentColor"
                    />
                  </svg>
                </button>
              </div>
              <h2 class="native-word" id="wordNative">—</h2>
              <span class="type-pill" id="wordType">—</span>
              <p class="meaning" id="wordMeaning">—</p>
              <p class="hint">Tap the card to reveal the scene</p>
            </article>
            <article class="card-face card-back">
              <div class="art-frame" id="artFrame">
                <div class="art-loading" id="artLoading">Painting the scene…</div>
                <img id="artImage" alt="Generated illustration" />
              </div>
              <div class="sentence">
                <p class="sentence-native" id="sentenceNative">—</p>
                <p class="sentence-roman" id="sentenceRoman">—</p>
                <p class="sentence-meaning" id="sentenceMeaning">—</p>
              </div>
            </article>
          </div>
        </div>

        <div class="action-row">
          <button class="icon-button" id="skipBtn" aria-label="Skip word">
            <span class="icon">✖</span>
            Skip
          </button>
          <button class="icon-button" id="askBtn" aria-label="Ask AI">
            <span class="icon">💬</span>
            Ask AI
          </button>
          <button class="icon-button" id="favBtn" aria-label="Favorite">
            <span class="icon">★</span>
            Favorite
          </button>
        </div>

        <button class="collect-btn" id="collectBtn">Collect the Word</button>
      </section>

      <section class="view" data-view="gallery">
        <div class="section-head">
          <h3>Gallery</h3>
          <p>All your collected words, ready to flip anytime.</p>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </section>

      <section class="view" data-view="quiz">
        <div class="section-head">
          <h3>Quick Quiz</h3>
          <p>Mixing meanings, translations, and pronunciations.</p>
        </div>
        <div class="quiz-card" id="quizCard">
          <div class="quiz-meta" id="quizMeta">Collect words to start the quiz.</div>
          <h4 id="quizQuestion">—</h4>
          <div class="quiz-options" id="quizOptions"></div>
          <button class="collect-btn quiz-btn" id="quizNextBtn" disabled>Next</button>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Primary">
        <button class="nav-btn active" data-view="learning">Learning</button>
        <button class="nav-btn" data-view="gallery">Gallery</button>
        <button class="nav-btn" data-view="quiz">Quiz</button>
      </nav>
    </main>

    <section class="modal hidden" id="askModal" aria-hidden="true">
      <div class="modal-card">
        <header>
          <h3>Ask AI</h3>
          <button class="close-btn" id="closeAsk">✕</button>
        </header>
        <div class="chat-body" id="chatBody"></div>
        <div class="chat-input">
          <textarea id="askInput" placeholder="Ask about pronunciation, usage, or nuance..."></textarea>
          <button class="collect-btn" id="sendAsk">Send</button>
        </div>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
